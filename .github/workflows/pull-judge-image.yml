name: pull-judge-image
on:
  push:
    branches: ["poc/pull-judge"]
    paths: ["examples/pull-judge/agent/**", ".github/workflows/pull-judge-image.yml"]
  pull_request:
    paths: ["examples/pull-judge/agent/**", ".github/workflows/pull-judge-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: examples/pull-judge/agent
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/wu-sheng/aws-agentcore-asz-pull-judge-agent:${{ github.sha }}
          cache-from: type=gha,scope=pull-judge
          cache-to: type=gha,mode=max,scope=pull-judge
